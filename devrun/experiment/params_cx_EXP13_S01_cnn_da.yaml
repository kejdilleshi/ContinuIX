# @package _global_
# AUTO-GENERATED by ContinuIX/tools/devstack.py — do not edit by hand.
# ContinuIX EXP13 S01, dev stack (IGM dev 0d9df551 + igm-smb-inference-user + bundled pinnbp CNN).
# Window 0.00 -> 10.00, DA epoch 5.00.

core:
  hardware:
    visible_gpus: [0]

defaults:
  - override /inputs:
    - local
  - override /processes:
    - iceflow
  - override /assimilations:
    - data_assimilation

inputs:
  local:
    filename: EXP13_S01_da.nc

processes:
  iceflow:
    physics:
      sliding:
        # Active friction scalar (MPa); `slidingco` is in unified.inputs, so the sliding law and the emulator
        # read it directly. tau_ref = slidingco * u_ref**(1/exponent) only keeps the writers consistent.
        slidingco: 0.2
        tau_ref: 0.9283177667225557
        u_ref: 100.0
      viscosity:
        arrhenius: 78.0
    emulator:
      network:
        # With numerics below these name the emulator bundled with IGM:
        # pinnbp_<Nz>_<vert_spacing>_<architecture>_<nb_layers>_<nb_out_filter>_2_1_a -> pinnbp_10_4_cnn_16_32_2_1_a
        architecture: cnn
        nb_layers: 16
        nb_out_filter: 32
    numerics:
      Nz: 10
      vert_spacing: 4.0
      basis_vertical: Lagrange
      basis_horizontal: central
      precision: single
    method: unified
    unified:
      display:
        print_cost: true
        print_cost_freq: 50
      # Must equal the emulator's fieldin.dat exactly, in order.
      inputs: [thk, usurf, arrhenius, slidingco, dX]
      bcs: []
      mapping: network
      optimizer: lbfgs
      lbfgs:
        memory: 20
      line_search: hager-zhang
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000
      network:
        pretrained_path: ""
        pretrained: true
        print_summary: true

assimilations:
  data_assimilation:
    control_list:
      - thk
    cost_list:
      - velsurf
      - icemask
    optimization:
      nbitmin: 50
      nbitmax: 1000
      step_size: 0.9
      retrain_iceflow_model: true
      fix_opti_normalization_issue: true
      obstacle_constraint: ['reproject']
      step_size_decay: 0.95
      pertubate: True
      patience: 200
    fitting:
      usurfobs_std: 2.0
      velsurfobs_std: 2.1
      thkobs_std: 20.0
      uniformize_thkobs: true
    regularization:
      thk: 300.0
      thk_1st_der: 100.0
      thk_2nd_der: 1000000.0
      smooth_anisotropy_factor: 1.0
      convexity_weight: 0.0
      to_regularize: thk
    scaling:
      thk: 1
      usurf: 0.5
    output:
      plot2d_live: false
      save_result_in_ncdf: geology-optimized.nc
      save_iterat_in_ncdf: false
      vars_to_save:
        - usurf
        - thk
        - slidingco
        - velbase_mag
        - velsurf_mag
        - velsurfobs_mag
        - divflux
        - icemask
        - arrhenius
